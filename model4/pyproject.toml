[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-rental-forecasting"
version = "0.1.0"
description = "Monthly rental prediction, temporal backtesting, and auxiliary-signal research for Singapore housing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas>=2.2,<3.1",
  "scipy==1.12.0",
  "scikit-learn==1.4.1.post1",
  "joblib==1.3.2",
  "pyarrow==19.0.1",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<14",
  "psutil>=5.9,<8",
  "threadpoolctl>=3.3,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
models = ["catboost==1.2.8", "torch==2.6.0", "xgboost>=2.1,<4"]
test = ["pytest>=8.4,<9"]

[project.scripts]
rental-local-backtest = "experiments.rolling_local.cli:main"
rental-signal-analysis = "analysis.external_signals:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "models*", "mean_residual_model*", "experiments*", "analysis*", "configs*"]
exclude = ["tests*", "results*", "data*", "artifacts*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json"]
"configs" = ["*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not training"'
markers = [
  "training: tests that fit an estimator; not part of repository preparation checks",
]
