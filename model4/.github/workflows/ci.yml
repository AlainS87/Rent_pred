name: Source and result integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source syntax, documentation and artifact boundaries
        run: python scripts/validate_repository.py
      - name: Read historical aggregate results
        run: python scripts/show_results.py --format json
      - name: Install contract-test dependencies
        run: python -m pip install -e ".[test]" catboost==1.2.8 xgboost==3.1.3 "setuptools>=68" wheel -c requirements/core-research.txt
      - name: Test all non-training contracts
        run: python -m pytest -m "not training"
      - name: Build and check the installed wheel outside the checkout
        run: python scripts/check_wheel.py
